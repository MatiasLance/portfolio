services:
  web:
    build:
      context: .
      args:
        NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL:-/}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://matiaslance.github.io}
    image: marcelo-matias-portfolio:local
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
