services:
  dev:
    image: node:22.14.0-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    environment:
      VITE_BASE: ./

volumes:
  dev_node_modules:
