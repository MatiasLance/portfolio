services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_nuxt:/app/.nuxt
    environment:
      NUXT_APP_BASE_URL: /
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://matiaslance.github.io}

volumes:
  dev_node_modules:
  dev_nuxt:
